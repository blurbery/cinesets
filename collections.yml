# CineSets by blurbery (https://github.com/blurbery/cinesets). Additional terms under AGPL-3.0 section 7 apply: see NOTICE.
#
# Each entry becomes one collection. Required fields:
#   key        unique id: lower-case letters, digits and dashes. Start movie keys with m- and TV keys with s-;
#              a movie and TV pair with the same ending (m-netflix, s-netflix) sit next to each other.
#   group      section: where it sits on the Collections page (see `order` in config.yml) and what people pick
#              under `collections` in config.yml
#   type       movie or show
#   title      big poster title (\n breaks the line)
# One of:
#   lists      public mdblist lists (user/list-slug), merged in order
#   titles     a fixed list of [title, year] (franchises); needs min if fewer than defaults.min_items films
# Optional:
#   subtitle         smaller white line under the title
#   accent           poster colour: purple, pink, blue, gold, green, red, teal, orange, silver, ice, a colour like
#                    "#ff3366", or two like ["#ff3366", "#ffaa00"] for the title's start and end
#   limit            most titles to keep (defaults.limit)
#   min              skip the collection if fewer titles match (defaults.min_items)
#   logo             streaming service logo key (netflix, prime, disney, hbomax, apple, hulu, paramount, peacock, stan)
#   backdrop_title   the film or show whose artwork the poster uses
#   backdrop_item    the server item id whose artwork the poster uses (instead of backdrop_title)
#   exclude_genres   drop titles with any of these genres
#   pin              keep at the very top of the Collections page (1 first)
#   ranked           false to keep a list's own order instead of its rank (default true)
#   display_order    how titles are ordered inside the collection: SortName or PremiereDate
#   overview         the collection's description
#   create_name      a temporary name to create the collection under (needed when its name was used before)
#   label            the small label at the top, instead of the one in config.yml (labels)
#
# A new group shows up in `list` and `pick` with its key as its name. To give it a proper one, add at the top level:
#   sections:
#     mygroup: "My section"

collections:

  # --- Seasonal. Remove or comment these out after the season ends.
  - key: m-halloween
    group: seasonal
    type: movie
    title: "Halloween"
    accent: red
    lists: [bsm-venger/halloween-movies]
  - key: s-halloween
    group: seasonal
    type: show
    title: "Halloween"
    accent: red
    lists: [bobnimbo/halloween-shows]
    backdrop_title: "Wednesday"
  - key: m-halloween-kids
    group: seasonal
    type: movie
    title: "Halloween"
    subtitle: "For Kids"
    accent: red
    lists: [hdlists/halloween-movies-for-kids]

  # --- Charts: trending, most watched and new releases. Trending entries are pinned to the top.
  - key: m-trending
    group: charts
    type: movie
    title: "Trending"
    subtitle: "Top 20"
    accent: pink
    lists: [snoak/trending-movies]
    pin: 1
    limit: 20
  - key: s-trending
    group: charts
    type: show
    title: "Trending"
    subtitle: "Top 20"
    accent: pink
    lists: [snoak/trakt-s-trending-shows]
    pin: 1
    limit: 20
    exclude_genres: ["Talk", "Talk Show", "News"]
  - key: m-trendingall
    group: charts
    type: movie
    title: "Trending"
    accent: pink
    lists: [snoak/trending-movies]
    pin: 2
    limit: 250
    backdrop_title: "Deadpool & Wolverine"
    create_name: "Movies - Trending (full list)"
  - key: s-trendingall
