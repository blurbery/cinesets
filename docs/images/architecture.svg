<text x="48" y="68" fill="#fff" font-size="34" font-weight="700" letter-spacing=".5">How CineSets fits together</text>
<text x="48" y="100" fill="#c9c3ff" font-size="17">One centre makes the collections. Each media server is its own core around it.</text>
<text x="1152" y="68" text-anchor="end" fill="#8f88c9" font-size="13">CineSets by blurbery</text>
