<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How CineSets fits together</title>
<desc id="d">An atom: the CineSets centre (collections, list matching, posters, dashboard, schedule) is the nucleus. A shell around it is the list of operations every server module provides. Emby and Jellyfin orbit it on one module, servers/emby.py; Silo orbits on its own, servers/silo.py; a dashed electron is the next server.</desc>
