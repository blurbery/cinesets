<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How CineSets fits together</title>
<desc id="d">A cluster. The CineSets centre (collections, list matching, posters, dashboard, schedule) is the nucleus, ringed by a shell: the questions every server module answers. Four server cores sit evenly around it on one orbit, each with its own module, its own ring and its own bond into the shell: Emby (servers/emby.py), Jellyfin (servers/jellyfin.py), Silo (servers/silo.py) and Plex, dashed, coming next as servers/plex.py.</desc>
