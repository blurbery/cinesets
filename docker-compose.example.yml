# CineSets with Docker Compose.
# CineSets by blurbery (https://github.com/blurbery/cinesets). SPDX-License-Identifier: AGPL-3.0-or-later
# Additional terms under AGPL-3.0 section 7 apply: see NOTICE.
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose build
#   docker compose run --rm cinesets setup    # your server's address and API key, and which collections
#   docker compose run --rm cinesets logos
#   docker compose up -d                       # creates the collections, then keeps them updated
#   docker compose run --rm -p 127.0.0.1:8095:8095 cinesets web --host 0.0.0.0   # the dashboard, while you need it
#                                                    (or keep it running with the cinesets-web service below)
#
# The server address must be reachable from inside the container: use your server's LAN address (for
# example http://192.0.2.10:8096, or http://192.0.2.10:8080 for Silo) or its container name on a shared
# Docker network (http://emby:8096), not 127.0.0.1. Data, posters and logos are kept in ./config/data.
# To customise collections, copy collections.yml to ./config/my-collections.yml and set
# collections_file: my-collections.yml in ./config/config.yml (see the README).
services:
  cinesets:
    build: .
    image: cinesets:local
    container_name: cinesets
    restart: unless-stopped
    volumes:
      - ./config:/config
    environment:
      PUID: 1000    # CineSets runs as this user and group, not root; ./config is handed to them
      PGID: 1000
    # Optional: keep the API key out of config.yml by putting CINESETS_API_KEY=... in ./config/cinesets.env
    # env_file: ./config/cinesets.env

  # The dashboard, always running (optional; see docs/dashboard.md). It is published on this host's 127.0.0.1 only:
  # use Tailscale (tailscale serve --bg 8095) or a reverse proxy with HTTPS on the host to reach it from elsewhere.
  # Get the sign-in link with: docker compose run --rm cinesets web --link
  # cinesets-web:
  #   image: cinesets:local
  #   pull_policy: never
  #   container_name: cinesets-web
  #   restart: unless-stopped
  #   command: ["web", "--host", "0.0.0.0"]
