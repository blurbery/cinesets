# Additional terms under AGPL-3.0 section 7 apply: see NOTICE.
#
# Semantic versioning from Conventional Commit titles. Every push to main updates a release pull request
# (version bump in cinesets/__init__.py and CHANGELOG.md). Merging that pull request tags the version and
# posts the notes to GitHub Releases. Only the maintainer can merge to main, so only the maintainer releases.
# Each merged pull request gives one line in the notes from its title, or one per line of its release notes box.
# After changing a merged pull request's box, run this workflow by hand so the release pull request catches up.
# Each release also publishes the Docker image ghcr.io/blurbery/cinesets for amd64 and arm64, tagged with the
# version (1.5.0), its minor and major versions (1.5 and 1) and latest.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # GitHub holds the checks on a pull request made with the workflow's own token until someone presses
      # "Approve workflows to run". With a GitHub App set up (CONTRIBUTING.md, Releases), the App makes the release
      # pull request instead and its checks start straight away. Without one, this step is skipped.
      - name: Token from the release app
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summary
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"

  # The Docker image, built from the release's own tag, only when the job above has just made a release. The first
  # time, the package on ghcr.io may need its visibility set to public (CONTRIBUTING.md, Releases).
  image:
    name: Docker image on ghcr.io
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/blurbery/cinesets
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Tags and labels
        id: meta
        run: |
          # 1.5.0 is also 1.5, 1 and latest; a pre-release such as 2.0.0-rc.1 gets only its own tag
          if printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags=$(printf '%s\n' "$IMAGE:$VERSION" "$IMAGE:${VERSION%.*}" "$IMAGE:${VERSION%%.*}" "$IMAGE:latest")
          elif printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$'; then
            tags="$IMAGE:$VERSION"
          else
            echo "::error::Unexpected version '$VERSION'"
            exit 1
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/blurbery/cinesets"
            echo "org.opencontainers.image.licenses=AGPL-3.0-or-later"
            echo "org.opencontainers.image.version=$VERSION"
            echo "org.opencontainers.image.revision=$(git rev-parse HEAD)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 to try it first
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          tags: cinesets:release
      - name: The image runs and has this version
        run: docker run --rm cinesets:release version | grep -F "Version $VERSION."
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build for amd64 and arm64, and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Published for linux/amd64 and linux/arm64:" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
