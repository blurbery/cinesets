name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly check against the newest server releases

permissions:
  contents: read

# A new push to a pull request replaces its older run. Every push to main, and every scheduled run, gets a run of
# its own, so a merge straight after another can't cancel the first one's tests.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/e2e
      - name: Shell scripts parse
        run: for f in install.sh run.sh docker-entrypoint.sh; do sh -n "$f"; done

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t cinesets:ci .
      - name: Runs and drops root
        run: |
          mkdir -p config/data
          printf 'server: {type: emby, url: "http://127.0.0.1:8096", api_key: "x"}\nlibraries: [{name: Movies, type: movie}]\ndata_dir: data\n' > config/config.yml
          sudo chown -R 0:0 config
          docker run --rm -v "$PWD/config:/config" cinesets:ci version
          docker run --rm -v "$PWD/config:/config" cinesets:ci list > list.txt
          test "$(wc -l < list.txt)" -ge 160
          test "$(stat -c %u:%g config)" = "1000:1000"
          test "$(stat -c %u:%g config/data)" = "1000:1000"
          if docker run --rm -e PUID=0 -v "$PWD/config:/config" cinesets:ci version; then echo "PUID=0 should be refused"; exit 1; fi

  end-to-end:
    name: End to end (${{ matrix.server.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.server.newest }}
    strategy:
      fail-fast: false
      matrix:
        server:
          - {name: "Jellyfin 10.10", kind: jellyfin, image: "jellyfin/jellyfin:10.10.7", newest: false}
          - {name: "Jellyfin 10.11", kind: jellyfin, image: "jellyfin/jellyfin:10.11.11", newest: false}
          - {name: "Jellyfin 12.2", kind: jellyfin, image: "jellyfin/jellyfin:12.2", newest: false}
          - {name: "Emby 4.9", kind: emby, image: "emby/embyserver:4.9.5.0", newest: false}
          - {name: "Emby 4.10", kind: emby, image: "emby/embyserver:4.10.1.0", newest: false}
          - {name: "Jellyfin latest", kind: jellyfin, image: "jellyfin/jellyfin:latest", newest: true}
          - {name: "Emby latest", kind: emby, image: "emby/embyserver:latest", newest: true}
          - {name: "Emby beta", kind: emby, image: "emby/embyserver:beta", newest: true}
    steps:
      - name: Newest releases are checked weekly and on request
        id: gate
        run: |
          if [ "${{ matrix.server.newest }}" = "true" ] && [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Make tiny test films and shows
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python tests/e2e/run_e2e.py --make-media media
      - name: Start a throwaway ${{ matrix.server.name }}
        if: steps.gate.outputs.skip != 'true'
        run: docker run -d --name media -p 127.0.0.1:8096:8096 -v "$PWD/media:/media:ro" ${{ matrix.server.image }}
      - name: CineSets against the real server
        if: steps.gate.outputs.skip != 'true'
        run: python tests/e2e/run_e2e.py --kind ${{ matrix.server.kind }} --url http://127.0.0.1:8096 --media /media
      - name: Server log on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        run: docker logs media 2>&1 | tail -n 150

  end-to-end-silo:
    name: End to end (Silo ${{ matrix.silo.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.silo.newest }}
    strategy:
      fail-fast: false
      matrix:
        silo:
          - {name: "build 1144", image: "ghcr.io/silo-server/silo-server:build-1144", newest: false}
          - {name: "latest", image: "ghcr.io/silo-server/silo-server:latest", newest: true}
    steps:
      - name: Newest releases are checked weekly and on request
        id: gate
        run: |
          if [ "${{ matrix.silo.newest }}" = "true" ] && [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Make tiny test films and shows
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python tests/e2e/run_silo_e2e.py --make-media media
      - name: Start a throwaway Silo (${{ matrix.silo.name }}) and its database
        if: steps.gate.outputs.skip != 'true'
        run: |
          docker network create silo
          docker run -d --name silo-db --network silo -e POSTGRES_USER=silo -e POSTGRES_PASSWORD=silo -e POSTGRES_DB=silo pgvector/pgvector:pg18
          for i in $(seq 60); do docker exec silo-db pg_isready -U silo -d silo > /dev/null 2>&1 && break; sleep 2; done
          docker run -d --name silo --network silo --restart on-failure -p 127.0.0.1:8080:8080 -p 127.0.0.1:8096:8096 \
            -e DATABASE_URL="postgres://silo:silo@silo-db:5432/silo?sslmode=disable" -e SECRET_KEY="$(openssl rand -base64 48)" \
            -v "$PWD/media:/mnt/media:ro" ${{ matrix.silo.image }}
      - name: CineSets against the real server
        if: steps.gate.outputs.skip != 'true'
        run: python tests/e2e/run_silo_e2e.py --url http://127.0.0.1:8080 --media /mnt/media
      - name: Server log on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        run: docker logs silo 2>&1 | tail -n 200

  end-to-end-proxies:
    name: End to end (dashboard behind Caddy and nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull Caddy and nginx
        run: |
          docker pull -q caddy:2
          docker pull -q nginx:stable
      - name: Dashboard on the runner, Caddy and nginx on the host network
        run: python tests/e2e/run_proxy_e2e.py --docker --caddy-image caddy:2 --nginx-image nginx:stable --logs proxy-logs/host
      - name: Build the CineSets image
        run: docker build -q -t cinesets:ci .
      - name: Dashboard in its own container, Caddy and nginx beside it on a Docker network
        run: python tests/e2e/run_proxy_e2e.py --image cinesets:ci --caddy-image caddy:2 --nginx-image nginx:stable --logs proxy-logs/network
      - name: Logs on failure
        if: failure()
        run: |
          docker ps -a
          for f in proxy-logs/*/*.log; do
            if [ -f "$f" ]; then echo "===== $f"; tail -n 100 "$f"; fi
          done
