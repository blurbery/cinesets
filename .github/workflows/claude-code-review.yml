#
# Reviews each pull request once with a single Claude Sonnet pass and posts inline comments plus a short summary.
# Later pushes are skipped once the summary (marked <!-- claude-review -->) exists.
# Skips drafts, bots, fork PRs (GitHub withholds secrets from them) and Markdown-only changes. Uses the
# ANTHROPIC_API_KEY secret (a Claude API key, billed per review). Without it, the job does nothing.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Add an ANTHROPIC_API_KEY repository secret to turn on Claude reviews."
      - name: Check for an earlier review
        id: earlier
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review -->"))) | .id' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This pull request already has a Claude review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIALS == 'true' && steps.earlier.outputs.reviewed != 'true'
        with:
          fetch-depth: 1
      # Claude Code itself rather than claude-code-action: with an API key, the action's runs were refused with "Credit
      # balance is too low" (400) on their first request, while the same key works for the plain CLI (November 2026).
      - name: Review with Claude Code
        id: review
        if: env.HAS_CREDENTIALS == 'true' && steps.earlier.outputs.reviewed != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PROMPT: |
            You're reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The PR branch is checked out in the working directory.

            1. Run `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}` to see what changed and why.
            2. Read AGENTS.md and CONTRIBUTING.md, if they exist, for the project's rules. Open other files only when you need context to judge a change.
            3. Look for real problems: bugs, crashes, regressions, broken edge cases, security issues, private details (keys, tokens, personal names or emails, server addresses, home-folder paths) and clear breaks of the project's rules. Skip style nitpicks and anything a linter or CI would catch.
            4. Post each real problem as an inline comment on the line it's about, with exactly this command (one per problem, LINE being the line number in the new version of the file):
               gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f commit_id=${{ github.event.pull_request.head.sha }} -f side=RIGHT -f path=PATH -F line=LINE -f body="..."
               Say what's wrong and how to fix it in a sentence or two.
            5. Finish with one short summary comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."`. Start the body with the line `<!-- claude-review -->` (it marks the PR as reviewed). If nothing needs fixing, say so in one line.

            Keep it short and only flag things worth fixing. Write in Australian English without em dashes.
          TOOLS: >-
            Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Read,Grep,Glob
        run: |
          npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.327 > /dev/null
          claude -p "$PROMPT" --model claude-sonnet-5-5 --max-turns 25 --allowedTools "$TOOLS" --output-format json \
            > "$RUNNER_TEMP/claude-execution-output.json"
          jq -r '"Claude: \(.num_turns) turns, about US$\(.total_cost_usd * 100 | round / 100)"' "$RUNNER_TEMP/claude-execution-output.json"
          jq -e '.is_error | not' "$RUNNER_TEMP/claude-execution-output.json" > /dev/null
      # A failed review's reason (a revoked or wrong key, no API credit left, an unknown model), from Claude's result,
      # which holds no secrets.
      - name: Say why the review failed
        if: failure() && steps.review.conclusion == 'failure'
        run: |
          LOG="$RUNNER_TEMP/claude-execution-output.json"
          [ -s "$LOG" ] || { echo "::error::Claude left no output to read."; exit 0; }
          jq -r '(if type == "array" then . else [.] end)
            | (map(select(.type == "assistant" and .error != null) | "Claude error: \(.error)") | unique[]),
              (map(select(.type == "result")) | last | "Claude said: \(.result // "nothing" | tostring | .[0:500])")' "$LOG" |
            sed 's/^/::error::/'
