#
# Reviews each pull request once with a single Claude Sonnet pass and posts inline comments plus a short summary.
# Later pushes are skipped once the summary (marked <!-- claude-review -->) exists.
# Skips drafts, bots, fork PRs (GitHub withholds secrets from them) and Markdown-only changes. Uses the
# ANTHROPIC_API_KEY secret (a Claude API key, billed per review), plus ANTHROPIC_WORKSPACE_ID for a key linked to an
# account rather than one workspace (sk-ant-usr-...): without it the API bills no workspace and answers "Credit
# balance is too low". Without a key, the job does nothing.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_CREDENTIALS: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Add an ANTHROPIC_API_KEY repository secret to turn on Claude reviews."
      - name: Check for an earlier review
        id: earlier
        if: env.HAS_CREDENTIALS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review -->"))) | .id' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This pull request already has a Claude review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CREDENTIALS == 'true' && steps.earlier.outputs.reviewed != 'true'
        with:
          fetch-depth: 1
      - name: TEMP one tiny API call (prints no secret)
        if: env.HAS_CREDENTIALS == 'true'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WS: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          for model in claude-haiku-5-5 claude-sonnet-5-5; do
            for ws in with without; do
              args=(-H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json")
              if [ "$ws" = with ]; then args+=(-H "anthropic-workspace-id: $WS"); fi
              code=$(curl -s -o "$RUNNER_TEMP/out.json" -w '%{http_code}' https://api.anthropic.com/v1/messages "${args[@]}" \
                -d "{\"model\":\"$model\",\"max_tokens\":5,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
              echo "messages $model, $ws workspace: HTTP $code $(jq -c '.error // {ok: true}' "$RUNNER_TEMP/out.json" | cut -c1-160)"
            done
          done
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        id: review
        if: env.HAS_CREDENTIALS == 'true' && steps.earlier.outputs.reviewed != 'true'
        env:
          # the workspace to bill, sent as a header the way Vivid's review sends it (the action's own
          # anthropic_workspace_id input is for workload identity federation)
          ANTHROPIC_CUSTOM_HEADERS: >-
            ${{ secrets.ANTHROPIC_WORKSPACE_ID != '' && format('anthropic-workspace-id: {0}', secrets.ANTHROPIC_WORKSPACE_ID) || '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You're reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. The PR branch is checked out in the working directory.

            1. Run `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}` to see what changed and why.
            2. Read AGENTS.md and CONTRIBUTING.md, if they exist, for the project's rules. Open other files only when you need context to judge a change.
            3. Look for real problems: bugs, crashes, regressions, broken edge cases, security issues, private details (keys, tokens, personal names or emails, server addresses, home-folder paths) and clear breaks of the project's rules. Skip style nitpicks and anything a linter or CI would catch.
            4. Post each real problem as an inline comment on the line it's about, with mcp__github_inline_comment__create_inline_comment. Say what's wrong and how to fix it in a sentence or two.
            5. Finish with one short summary comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."`. Start the body with the line `<!-- claude-review -->` (it marks the PR as reviewed). If nothing needs fixing, say so in one line.

            Keep it short and only flag things worth fixing. Write in Australian English without em dashes.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
      # The action hides Claude's output, so a failed review only says "is_error: true". Show the reason (a revoked or
      # wrong key, no API credit left, an unknown model) from Claude's last result, which holds no secrets.
      - name: Say why the review failed
        if: failure() && steps.review.conclusion == 'failure'
        env:
          LOG: ${{ steps.review.outputs.execution_file }}
        run: |
          [ -f "$LOG" ] || LOG="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$LOG" ] || { echo "::error::Claude left no output file to read."; exit 0; }
          jq -r '(if type == "array" then . else [.] end)
            | (map(select(.type == "assistant" and .error != null) | "Claude error: \(.error)") | unique[]),
              (map(select(.type == "result")) | last | "Claude said: \(.result // "nothing" | tostring | .[0:500])")' "$LOG" |
            sed 's/^/::error::/'
